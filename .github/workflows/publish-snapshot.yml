name: Publish Maven Central snapshot

on:
  workflow_dispatch:
    inputs:
      version:
        description: Snapshot version
        required: true
        default: 0.1.0-SNAPSHOT
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Validate snapshot version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?-SNAPSHOT$ ]]; then
            echo "::error::Snapshot version must end with -SNAPSHOT: $VERSION"
            exit 1
          fi

      - name: Validate Maven Central credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done

      - name: Build and publish snapshot
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: >-
          ./gradlew clean build publish
          -PreleaseVersion=${{ inputs.version }}
          -PpublishCentralSnapshots=true
          --no-daemon
