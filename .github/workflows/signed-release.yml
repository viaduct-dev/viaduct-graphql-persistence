name: Build signed artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version without the v prefix
        required: true
        default: 0.1.0-SNAPSHOT
        type: string

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$REQUESTED_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate signing secrets
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          for name in SIGNING_KEY_ID SIGNING_KEY SIGNING_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done

      - name: Build signed Maven repository
        env:
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew clean build publish
          -PreleaseVersion=${{ steps.release.outputs.version }}
          -PisolatedRepository=${{ github.workspace }}/build/signed-maven-repository
          --no-daemon

      - name: Verify signed artifacts
        run: |
          repository="${{ github.workspace }}/build/signed-maven-repository"
          artifact_count=0
          while IFS= read -r artifact; do
            artifact_count=$((artifact_count + 1))
            if [[ ! -f "${artifact}.asc" ]]; then
              echo "::error::Missing signature for ${artifact#$repository/}"
              exit 1
            fi
          done < <(
            find "$repository" -type f \
              \( -name "*.jar" -o -name "*.pom" -o -name "*.module" \)
          )
          if [[ "$artifact_count" -eq 0 ]]; then
            echo "::error::No Maven artifacts were produced"
            exit 1
          fi
          find "$repository" -name "*-sources.jar" -print -quit | grep -q .
          find "$repository" -name "*-javadoc.jar" -print -quit | grep -q .
          if [[ "${{ steps.release.outputs.is_release }}" == "true" ]] &&
            grep -R -n --include="*.pom" -- "-SNAPSHOT" "$repository"; then
            echo "::error::Release POMs cannot depend on SNAPSHOT artifacts"
            exit 1
          fi

      - name: Create signed repository archive
        working-directory: build/signed-maven-repository
        run: >-
          zip -qr
          ../viaduct-graphql-persistence-${{ steps.release.outputs.version }}-signed.zip
          .

      - uses: actions/upload-artifact@v7
        with:
          name: viaduct-graphql-persistence-${{ steps.release.outputs.version }}-signed
          path: |
            build/signed-maven-repository
            build/viaduct-graphql-persistence-${{ steps.release.outputs.version }}-signed.zip
          if-no-files-found: error
          retention-days: 30
