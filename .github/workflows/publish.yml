name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and publish Maven repository
        run: >-
          ./gradlew build publish
          -PisolatedRepository=${{ github.workspace }}/build/pages-repository
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages-repository

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish Maven repository
        id: deployment
        uses: actions/deploy-pages@v5
